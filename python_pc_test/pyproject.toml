[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-test"
version = "2.0.0"
description = "Hardware compatibility testing tool for Alt Linux (Bazalt SPO methodology) - Python rewrite"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "Bazalt SPO", email = "info@basealt.ru"}
]
maintainers = [
    {name = "Python Rewrite Team"}
]
keywords = ["hardware", "testing", "alt-linux", "bazalt", "compatibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Hardware",
    "Topic :: System :: Benchmark",
]
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.9.0",
    "py-cpuinfo>=9.0.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "types-psutil",
]

[project.scripts]
pc-test = "python_pc_test.pc_test:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["python_pc_test*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
